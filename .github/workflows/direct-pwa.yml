name: HuePop Direct PWA ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pwa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout direct Stripe build
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze HuePop Direct
        run: flutter analyze

      - name: Build release PWA
        run: flutter build web --release

      - name: Verify PWA output
        run: |
          test -f build/web/index.html
          test -f build/web/manifest.json
          test -d build/web/icons
          echo "HuePop PWA output verified."

      - name: Create BigUpStar PWA ZIP
        working-directory: build/web
        run: zip -r ../../HuePop-Direct-PWA.zip .

      - name: Upload PWA ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuePop-Direct-PWA
          path: HuePop-Direct-PWA.zip
          if-no-files-found: error
          retention-days: 30
